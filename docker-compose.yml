services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: agrigrade
      POSTGRES_PASSWORD: agrigrade
      POSTGRES_DB: agrigrade
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrigrade"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agrigrade:agrigrade@db:5432/agrigrade
      JWT_SECRET: change-this-secret-in-production
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/code/storage

volumes:
  pgdata:
